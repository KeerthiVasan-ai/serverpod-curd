### A note created by the user, stored in the database with an optional embedding vector for semantic search.
class: Note

# Database table backing
table: note

# The fields (and columns if connected to the database) of the class.
fields:
  ### The title of the note.
  title: String

  ### The main content body of the note.
  content: String

  ### The embedding vector generated by Gemini for semantic search.
  embedding: List<double>?

  ### The time when the note was created.
  createdAt: DateTime

services:
  # Development services
  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "8090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: smart_notes
      POSTGRES_PASSWORD: "xFU75Fos7hNV_3yKO6M8O4AivaQIJZ7W"
    volumes:
      - smart_notes_data:/var/lib/postgresql/data

  redis:
    image: redis:6.2.6
    ports:
      - "8091:6379"
    command: redis-server --requirepass "XW-Q8_7xRbqnJpf06bN7pOKSau86wD2f"
    environment:
      - REDIS_REPLICATION_MODE=master

  # Test services
  postgres_test:
    image: pgvector/pgvector:pg16
    ports:
      - "9090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: smart_notes_test
      POSTGRES_PASSWORD: "534rruMkyPsMWp-FVgfSIrCregwWzJpD"
    volumes:
      - smart_notes_test_data:/var/lib/postgresql/data

  redis_test:
    image: redis:6.2.6
    ports:
      - "9091:6379"
    command: redis-server --requirepass "D8eyrwukwum1_Lzrr1kKlAOV1x_nhrWa"
    environment:
      - REDIS_REPLICATION_MODE=master

volumes:
  smart_notes_data:
  smart_notes_test_data:
